[build]
builder = "dockerfile"

[deploy]
startCommand = "sh -c 'uvicorn server.app:app --host 0.0.0.0 --port ${PORT:-8000}'"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "on_failure"

# ── Persistent Volume (IMPORTANT) ─────────────────────────────────────────────
# Without a volume, learned stocks reset on every redeploy.
# To persist everything:
#   1. Railway dashboard → your service → Storage → Add Volume
#   2. Mount path: /data
#   3. Add env var: DATA_DIR = /data
#   4. Redeploy once
